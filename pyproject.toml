[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic characters in comments
    "RUF012",  # HA class attributes (_attr_event_types...)
    "ASYNC109", "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
